# Optimized Local Docker Development & Testing Stack
# Platform: K12 Realtime Classroom Game System
#
# Usage:
#   mvn clean package -DskipTests
#   docker compose -f docker-compose.dev.yml up -d --build
#   docker compose -f docker-compose.dev.yml down -v

name: uni-realtime-dev

networks:
  uni-dev-net:
    driver: bridge

services:
  # Valkey (BSD-3 licensed, Redis-compatible in-memory store for room leases)
  room-store:
    image: valkey/valkey:8.1-alpine
    container_name: uni-room-store
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks: [uni-dev-net]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Single-broker KRaft Kafka for event streaming
  kafka:
    image: apache/kafka:3.9.0
    container_name: uni-kafka
    restart: unless-stopped
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
    ports:
      - "29092:29092"
    networks: [uni-dev-net]
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Game Engine Pod 0
  engine-0:
    build:
      context: .
      dockerfile: modules/uni-game-engine/Dockerfile
    container_name: uni-engine-0
    restart: unless-stopped
    environment:
      SERVER_PORT: "8090"
      ENGINE_FRAME_PORT: "9100"
      ENGINE_POD_ID: "engine-0"
      ENGINE_POD_COUNT: "2"
      ENGINE_ROOM_STORE_ENABLED: "true"
      ENGINE_ROOM_STORE_URI: "redis://room-store:6379"
      ENGINE_KAFKA_ENABLED: "true"
      ENGINE_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      ENGINE_KAFKA_TOPIC: "game.events.v1"
    ports:
      - "18090:8090"
    depends_on:
      room-store:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks: [uni-dev-net]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Game Engine Pod 1
  engine-1:
    build:
      context: .
      dockerfile: modules/uni-game-engine/Dockerfile
    container_name: uni-engine-1
    restart: unless-stopped
    environment:
      SERVER_PORT: "8090"
      ENGINE_FRAME_PORT: "9100"
      ENGINE_POD_ID: "engine-1"
      ENGINE_POD_COUNT: "2"
      ENGINE_ROOM_STORE_ENABLED: "true"
      ENGINE_ROOM_STORE_URI: "redis://room-store:6379"
      ENGINE_KAFKA_ENABLED: "true"
      ENGINE_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      ENGINE_KAFKA_TOPIC: "game.events.v1"
    ports:
      - "18091:8090"
    depends_on:
      room-store:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks: [uni-dev-net]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Game Engine Pod 2 -- deliberately NOT listed in `gateway`/`gateway-1`'s ENGINE_PODS below.
  # Exists only for DockerComposeScaleUpIT (plan.md Task 21): started mid-test to simulate an SRE
  # adding Engine capacity without restarting Gateway, so the test can prove whether Gateway ever
  # routes a room to it. Not part of `docker compose up -d` by default in the sense that nothing
  # depends_on it -- start it explicitly (`docker compose up -d engine-2`) when running that test.
  engine-2:
    build:
      context: .
      dockerfile: modules/uni-game-engine/Dockerfile
    container_name: uni-engine-2
    restart: unless-stopped
    environment:
      SERVER_PORT: "8090"
      ENGINE_FRAME_PORT: "9100"
      ENGINE_POD_ID: "engine-2"
      ENGINE_POD_COUNT: "2"
      ENGINE_ROOM_STORE_ENABLED: "true"
      ENGINE_ROOM_STORE_URI: "redis://room-store:6379"
      ENGINE_KAFKA_ENABLED: "true"
      ENGINE_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      ENGINE_KAFKA_TOPIC: "game.events.v1"
    ports:
      - "18092:8090"
    depends_on:
      room-store:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks: [uni-dev-net]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # WebSocket Gateway Edge
  gateway:
    build:
      context: .
      dockerfile: modules/uni-websocket-gateway/Dockerfile
    container_name: uni-gateway
    restart: unless-stopped
    environment:
      SERVER_PORT: "8080"
      GATEWAY_WS_PORT: "9000"
      ENGINE_PODS: "engine-0:9100,engine-1:9100"
      SPRING_PROFILES_ACTIVE: "dev-docker"
      GATEWAY_DEV_JOIN_TOKEN_ENABLED: "true"
      GATEWAY_DEV_JOIN_TOKEN_SECRET: "uni-realtime-local-docker-dev-secret-do-not-use-elsewhere"
    ports:
      - "9000:9000"
      - "8080:8080"
    depends_on:
      engine-0:
        condition: service_healthy
      engine-1:
        condition: service_healthy
    networks: [uni-dev-net]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Second Gateway pod -- closes plan.md Task 13's "2 GW + 2 Engine" AC. Identical to `gateway`
  # above (same Engine pod list, same dev-join-token secret) other than host ports/container name, so
  # this is a genuine second pod, not a proxy in front of the first. `gateway`'s own name/ports
  # are untouched -- DockerComposeResyncIT hardcodes port 9000 against it.
  gateway-1:
    build:
      context: .
      dockerfile: modules/uni-websocket-gateway/Dockerfile
    container_name: uni-gateway-1
    restart: unless-stopped
    environment:
      SERVER_PORT: "8080"
      GATEWAY_WS_PORT: "9000"
      ENGINE_PODS: "engine-0:9100,engine-1:9100"
      SPRING_PROFILES_ACTIVE: "dev-docker"
      GATEWAY_DEV_JOIN_TOKEN_ENABLED: "true"
      GATEWAY_DEV_JOIN_TOKEN_SECRET: "uni-realtime-local-docker-dev-secret-do-not-use-elsewhere"
    ports:
      - "9001:9000"
      - "8081:8080"
    depends_on:
      engine-0:
        condition: service_healthy
      engine-1:
        condition: service_healthy
    networks: [uni-dev-net]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
