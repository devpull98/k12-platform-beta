spring:
  application:
    name: spring-ticket-ddd

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:mysql://localhost:3306/ticket_dd?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ticket_user
    password: ticket_pass

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379
    mongodb:
      uri: mongodb://ticket_user:ticket_pass@localhost:27017/ticket_dd?authSource=admin

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: spring-ticket-ddd
      auto-offset-reset: earliest

resilience4j:
  ratelimiter:
    instances:
      seatHold:
        limit-for-period: 100
        limit-refresh-period: 1s
        timeout-duration: 0s

  circuitbreaker:
    instances:
      paymentGateway:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-duration-threshold: 2s
        slow-call-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      show-components: always
  health:
    circuitbreakers:
      enabled: true
    ratelimiters:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
  tracing:
    sampling:
      probability: 1.0

logging:
  file:
    name: logs/app.log
