spring:
  application:
    name: spring-ticket-ddd

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:mysql://localhost:3306/ticket_dd?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ticket_user
    password: ticket_pass

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: spring-ticket-ddd
      auto-offset-reset: earliest

resilience4j:
  # Instance names below must match the "name" attribute on @RateLimiter/@CircuitBreaker
  # annotations, e.g. @RateLimiter(name = "seatHold"), @CircuitBreaker(name = "paymentGateway").
  ratelimiter:
    instances:
      seatHold:
        limit-for-period: 100      # max permits per period, sized to your seat-hold throughput target
        limit-refresh-period: 1s
        timeout-duration: 0s       # fail fast instead of queueing callers

  circuitbreaker:
    instances:
      paymentGateway:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-duration-threshold: 2s
        slow-call-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  health:
    circuitbreakers:
      enabled: true
    ratelimiters:
      enabled: true
