global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Every Spring Boot service scrape job carries service_type: springboot so
  # alert rules (AppDown et al.) can match "any app instance" generically
  # instead of hardcoding one job name — add the same label when onboarding
  # a new service, no alerts.yml change needed.
  - job_name: spring-ticket-ddd
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          service_type: springboot
          application: spring-ticket-ddd

  # service-2: 2nd instance of the same jar (same jar/config, different
  # port + spring.application.name) — kept running by default so the
  # multi-service dashboards/alerts have a real 2nd service to prove
  # against, not just a single-instance happy path.
  - job_name: service-2
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8081"]
        labels:
          service_type: springboot
          application: service-2

  - job_name: mysql
    static_configs:
      - targets: ["host.docker.internal:9104"]

  - job_name: redis
    static_configs:
      - targets: ["host.docker.internal:9121"]

  - job_name: kafka
    static_configs:
      - targets: ["host.docker.internal:9308"]

  - job_name: node
    static_configs:
      - targets: ["host.docker.internal:9100"]

  - job_name: mongodb
    static_configs:
      - targets: ["host.docker.internal:9216"]

  # Cross-stack metrics test services (see docker-compose.yml) — on the same
  # "observability" network as Prometheus, so scraped by service name rather
  # than host.docker.internal like the host-run Spring app.
  # application label added (same convention as the Spring jobs above) so
  # these show up as rows in the unified "Services Health & Performance
  # Matrix" table in services-overview.json, joined by (application).
  - job_name: express-metrics
    static_configs:
      - targets: ["express-metrics:3000"]
        labels:
          service_type: nodejs
          application: express-metrics

  - job_name: laravel-metrics
    static_configs:
      - targets: ["laravel-metrics:8000"]
        labels:
          service_type: php
          application: laravel-metrics
