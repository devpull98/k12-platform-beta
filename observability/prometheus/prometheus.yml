global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Every Spring Boot service scrape job carries service_type: springboot so
  # alert rules (AppDown et al.) can match "any app instance" generically
  # instead of hardcoding one job name — add the same label when onboarding
  # a new service, no alerts.yml change needed.
  # Two gateway and two engine instances by default: route-cache learning (8.2) and
  # per-pod fan-out are only observable with more than one instance of each, and the
  # dashboards are built to prove that, not a single-instance happy path.
  # Run a 2nd instance with: mvn -pl gateway spring-boot:run -Dspring-boot.run.arguments=--server.port=8081
  - job_name: gateway-1
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          service_type: springboot
          application: uni-gateway

  - job_name: gateway-2
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8081"]
        labels:
          service_type: springboot
          application: uni-gateway-2

  - job_name: engine-1
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8090"]
        labels:
          service_type: springboot
          application: uni-engine

  - job_name: engine-2
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8091"]
        labels:
          service_type: springboot
          application: uni-engine-2

  # No mysql / redis / kafka / mongodb / node jobs: those exporters lived in the root
  # docker-compose.yml, which Phase 1 does not have (no datastore on the hot path).
  # alerts.yml still carries their rules — an absent series never evaluates to == 0, so
  # they stay dormant rather than firing, and come back the moment an exporter does.

  # Cross-stack metrics test services (see docker-compose.yml) — on the same
  # "observability" network as Prometheus, so scraped by service name rather
  # than host.docker.internal like the host-run Spring app.
  # application label added (same convention as the Spring jobs above) so
  # these show up as rows in the unified "Services Health & Performance
  # Matrix" table in services-overview.json, joined by (application).
  - job_name: express-metrics
    static_configs:
      - targets: ["express-metrics:3000"]
        labels:
          service_type: nodejs
          application: express-metrics

  - job_name: laravel-metrics
    static_configs:
      - targets: ["laravel-metrics:8000"]
        labels:
          service_type: php
          application: laravel-metrics
