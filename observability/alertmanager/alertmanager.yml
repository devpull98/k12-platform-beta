global:
  resolve_timeout: 5m

# ── Routing tree ─────────────────────────────────────────────
# severity=critical → Telegram + Google Chat  (response SLA: 15 phút)
# severity=warning  → Google Chat             (response SLA: 2 giờ)
# default           → Google Chat             (response SLA: 8 giờ / next business day)

route:
  group_by: ["alertname", "team"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: default

  routes:
    - match:
        severity: critical
      receiver: critical
      repeat_interval: 1h

    - match:
        severity: warning
      receiver: warning
      repeat_interval: 4h

# ── Receivers ────────────────────────────────────────────────
receivers:
  - name: default
    webhook_configs:
      - url: "${GOOGLE_CHAT_WEBHOOK_URL}"
        send_resolved: true

  - name: warning
    webhook_configs:
      - url: "${GOOGLE_CHAT_WEBHOOK_URL}"
        send_resolved: true

  - name: critical
    telegram_configs:
      - bot_token: "${TELEGRAM_BOT_TOKEN}"
        chat_id: ${TELEGRAM_CHAT_ID}
        message: |
          🔴 *CRITICAL* — {{ .GroupLabels.alertname }}
          Team: {{ .GroupLabels.team }}
          {{ range .Alerts }}
          • {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}
        send_resolved: true
    webhook_configs:
      - url: "${GOOGLE_CHAT_WEBHOOK_URL}"
        send_resolved: true

# ── Inhibit rules ─────────────────────────────────────────────
inhibit_rules:
  # Nếu App DOWN thì suppress DEGRADED warnings của cùng app
  - source_match:
      alertname: AppDown
    target_match_re:
      alertname: "App.*"
    equal: ["job"]
  # Nếu MySQL DOWN thì suppress HikariCP warnings
  - source_match:
      alertname: MySQLDown
    target_match:
      alertname: HikariPoolExhausted
