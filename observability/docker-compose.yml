networks:
  observability:
    driver: bridge

services:
  prometheus:
    image: prom/prometheus:v2.53.4
    container_name: uni-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - observability
    deploy:
      resources:
        limits:
          memory: 384m
          cpus: "0.4"
        reservations:
          memory: 96m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: uni-alertmanager
    restart: unless-stopped
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml.template:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        esc() { printf '%s' "$$1" | sed -e 's/[&\\#]/\\&/g'; };
        TBT=$$(esc "$$TELEGRAM_BOT_TOKEN");
        TCI=$$(esc "$$TELEGRAM_CHAT_ID");
        sed
        -e "s#\$${TELEGRAM_BOT_TOKEN}#$$TBT#g"
        -e "s#\$${TELEGRAM_CHAT_ID}#$$TCI#g"
        /etc/alertmanager/alertmanager.yml.template > /tmp/alertmanager.yml &&
        exec /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager
    environment:
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID}"
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - observability
    deploy:
      resources:
        limits:
          memory: 64m
          cpus: "0.1"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  loki:
    image: grafana/loki:3.1.2
    container_name: uni-loki
    restart: unless-stopped
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "${LOKI_PORT:-3100}:3100"
    networks:
      - observability
    deploy:
      resources:
        limits:
          memory: 320m
          cpus: "0.3"
        reservations:
          memory: 96m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  tempo:
    image: grafana/tempo:2.6.1
    container_name: uni-tempo
    restart: unless-stopped
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
    command: -config.file=/etc/tempo.yaml
    ports:
      - "${TEMPO_OTLP_HTTP_PORT:-4318}:4318"
      - "${TEMPO_OTLP_GRPC_PORT:-4317}:4317"
      - "3200:3200"
    networks:
      - observability
    deploy:
      resources:
        limits:
          memory: 320m
          cpus: "0.3"
        reservations:
          memory: 96m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  promtail:
    image: grafana/promtail:3.1.2
    container_name: uni-promtail
    restart: unless-stopped
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - ${APP_LOG_DIR:-../logs}:/logs:ro
    command: -config.file=/etc/promtail/config.yml -config.expand-env=true
    environment:
      APP_JOB_NAME: "${APP_JOB_NAME:-k12-platform-beta}"
    networks:
      - observability
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          memory: 96m
          cpus: "0.1"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:11.3.2
    container_name: uni-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    networks:
      - observability
    depends_on:
      - prometheus
      - loki
      - tempo
    deploy:
      resources:
        limits:
          memory: 384m
          cpus: "0.4"
        reservations:
          memory: 96m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  loki-data:
  grafana-data:
