spring:
  application:
    name: uni-websocket-gateway

server:
  port: ${SERVER_PORT:8080}

uni:
  gateway:
    ws-port: ${GATEWAY_WS_PORT:9000}
    event-loop-multiplier: 2

    engine:
      pods: ${ENGINE_PODS:localhost:9100}
      pod-discovery:
        enabled: ${GATEWAY_ENGINE_POD_DISCOVERY_ENABLED:false}
        room-store-uri: ${GATEWAY_ENGINE_POD_DISCOVERY_ROOM_STORE_URI:redis://localhost:6379}
        poll-interval-seconds: ${GATEWAY_ENGINE_POD_DISCOVERY_POLL_INTERVAL_SECONDS:5}

    dev-join-token:
      enabled: ${GATEWAY_DEV_JOIN_TOKEN_ENABLED:false}
      hmac-secret: ${GATEWAY_DEV_JOIN_TOKEN_SECRET:}
      ttl-seconds: ${GATEWAY_DEV_JOIN_TOKEN_TTL_SECONDS:300}
      replay-guard-enabled: ${GATEWAY_DEV_JOIN_TOKEN_REPLAY_GUARD_ENABLED:false}

    always-accept-join-token:
      enabled: ${GATEWAY_ALWAYS_ACCEPT_JOIN_TOKEN_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      show-components: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
          show-components: always
        readiness:
          include: readinessState
          show-components: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  tracing:
    sampling:
      probability: 1.0

google:
  chat:
    webhook-url: ${GOOGLE_CHAT_WEBHOOK_URL:}

telegram:
  bot-token: ${TELEGRAM_BOT_TOKEN:}
  chat-id: ${TELEGRAM_CHAT_ID:}
