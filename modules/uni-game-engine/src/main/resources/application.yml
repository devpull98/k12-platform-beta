spring:
  application:
    name: uni-game-engine

server:
  port: ${SERVER_PORT:8090}

uni:
  engine:
    frame-port: ${ENGINE_FRAME_PORT:9100}
    pod-id: ${ENGINE_POD_ID:engine-0}
    advertised-host: ${ENGINE_ADVERTISED_HOST:${uni.engine.pod-id}}
    pod-count: ${ENGINE_POD_COUNT:1}
    room-store:
      enabled: ${ENGINE_ROOM_STORE_ENABLED:false}
      uri: ${ENGINE_ROOM_STORE_URI:redis://localhost:6379}
      lease-ttl-seconds: ${ENGINE_ROOM_STORE_LEASE_TTL_SECONDS:20}

    kafka:
      enabled: ${ENGINE_KAFKA_ENABLED:false}
      bootstrap-servers: ${ENGINE_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
      topic: ${ENGINE_KAFKA_TOPIC:game.events.v1}
      queue-capacity: ${ENGINE_KAFKA_QUEUE_CAPACITY:1000}

  room:
    coalesce-window-ms: 200
    handler-warn-threshold-ms: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      show-components: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
          show-components: always
        readiness:
          include: readinessState
          show-components: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  tracing:
    sampling:
      probability: 1.0

google:
  chat:
    webhook-url: ${GOOGLE_CHAT_WEBHOOK_URL:}

telegram:
  bot-token: ${TELEGRAM_BOT_TOKEN:}
  chat-id: ${TELEGRAM_CHAT_ID:}
