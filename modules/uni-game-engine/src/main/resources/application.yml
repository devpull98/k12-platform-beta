spring:
  application:
    name: uni-game-engine

# No virtual threads: room logic runs on Pekko dispatchers, one thread at a time per room.

server:
  # Actuator/management only. Frame-channel traffic uses the Netty port below.
  port: ${SERVER_PORT:8090}

uni:
  engine:
    # Internal frame channel (length-prefixed protobuf over one long-lived TCP connection
    # per gateway pod, multiplexed by room_id — not one connection per room).
    frame-port: ${ENGINE_FRAME_PORT:9100}
    # Stamped into InternalHeader.owner_pod_id on every response; this is what the gateway
    # route cache learns from.
    pod-id: ${ENGINE_POD_ID:engine-0}
    # Task 21: how OTHER pods/Gateway can dial this pod -- defaults to pod-id because Docker
    # Compose's own DNS already resolves a container by its service name, and this repo's
    # convention (GatewayNetworkLifecycle's javadoc) already assumes pod-id == hostname. Override
    # only if a real deployment's reachable hostname ever differs from pod-id.
    advertised-host: ${ENGINE_ADVERTISED_HOST:${uni.engine.pod-id}}
    # Phase 1 ownership is room_id % pod-count, isolated behind RoomOwnership so Phase 2
    # can swap in Cluster Sharding by replacing one class (decision B2). Used as the
    # ModuloRoomOwnership fallback even when room-store.enabled=true (see below).
    pod-count: ${ENGINE_POD_COUNT:1}

    # The external, shared-across-pods store backing room ownership leases + Hot Snapshot.
    # Deliberately named by role, not by product (Valkey today -- see docker-compose.dev.yml and
    # DistributedRoomLeaseStore's javadoc): swapping the backing product later is a config/ops
    # change, not a rename across this codebase.
    room-store:
      # Task 14 (2026-09-07 decision): LeaseBasedRoomOwnership + Hot Snapshot replace static
      # modulo ownership, but default OFF -- neither DistributedRoomLeaseStore nor
      # DistributedRoomSnapshotStore has been run against a real store instance (none available
      # while writing this code, see their javadoc). Flip only after verifying against the real
      # cluster; until then this pod behaves exactly as before (ModuloRoomOwnership, no
      # snapshotting).
      #
      # This connects through Lettuce's RedisClient regardless of the backing product -- Lettuce
      # is a RESP-protocol client and never renamed its own API for Valkey (see
      # DistributedRoomLeaseStore's javadoc). The URI scheme below is "redis://" for the same
      # reason, not a leftover.
      enabled: ${ENGINE_ROOM_STORE_ENABLED:false}
      uri: ${ENGINE_ROOM_STORE_URI:redis://localhost:6379}
      # Recommendation from plan.md Task 14: short enough for fast crash recovery, renewed at
      # ttl/3 by a live pod so a healthy room never loses its own lease mid-session.
      lease-ttl-seconds: ${ENGINE_ROOM_STORE_LEASE_TTL_SECONDS:20}

    kafka:
      # Task 18 (§9.3 Rủi ro 6): default OFF for the same reason room-store.enabled is --
      # KafkaProducer construction itself doesn't block on a broker being reachable, but there is
      # nothing to verify this against in this development environment (no broker), so it stays
      # opt-in.
      enabled: ${ENGINE_KAFKA_ENABLED:false}
      bootstrap-servers: ${ENGINE_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
      topic: ${ENGINE_KAFKA_TOPIC:game.events.v1}
      # Bounded queue capacity between RoomActor and the dedicated publisher worker thread
      # (Task 18) -- deliberately small; this is a drop-under-overload safety valve, not a
      # durability buffer (the room-store Hot Snapshot / client RingBuffer are the durability
      # story).
      queue-capacity: ${ENGINE_KAFKA_QUEUE_CAPACITY:1000}

  room:
    # Ceiling on broadcast frequency, NOT a tick rate: a silent room emits zero packets
    # (ADR-4). Phase 1 implements COALESCE only; a definition asking for FIXED is rejected
    # at load time.
    coalesce-window-ms: 200
    # The single-threaded room handler is measured, warned about, and never interrupted —
    # Java cannot safely abort a running handler (10.5).
    handler-warn-threshold-ms: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      show-components: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
          show-components: always
        readiness:
          include: readinessState
          show-components: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  tracing:
    sampling:
      probability: 1.0

google:
  chat:
    webhook-url: ${GOOGLE_CHAT_WEBHOOK_URL:}

telegram:
  bot-token: ${TELEGRAM_BOT_TOKEN:}
  chat-id: ${TELEGRAM_CHAT_ID:}
